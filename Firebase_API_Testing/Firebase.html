<!DOCTYPE html>
<html>
<head>
  <title>Store & Get Flag</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Replace with your Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Store your given flag
    async function storeFlag() {
      await set(ref(db, "flags/challenge1"), 
        "WOLF{Cyber_wolf_Team_6379869678_Tamilselvan_Founder}"
      );
      alert("Flag stored ✅");
    }

    // Retrieve the flag
    async function getFlag() {
      const snapshot = await get(child(ref(db), "flags/challenge1"));
      if (snapshot.exists()) {
        alert("Retrieved: " + snapshot.val());
      } else {
        alert("Flag not found ❌");
      }
    }

    window.onload = async () => {
      await storeFlag();
      await getFlag();
    };
  </script>
</head>
<body>
  <h1>Firebase Flag Example</h1>
</body>
</html>
